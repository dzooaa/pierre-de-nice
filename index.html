<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Pierre Nice – Prêt-à-porter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --fond:#ffffff;--encre:#0d0d0d;--encre-douce:#5f5f5f;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{background:var(--fond);scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:var(--fond);color:var(--encre);
  font-family:"Montserrat","Segoe UI",system-ui,-apple-system,Arial,sans-serif;display:flex;justify-content:center}
.carte{width:100%;max-width:440px;margin:14px;border:1px solid var(--encre);border-radius:28px;
  padding:44px 22px 22px;display:flex;flex-direction:column;align-items:center}
.logo{width:100%;max-width:290px;height:auto;display:block}
.liste{width:100%;margin:34px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px}
.btn{display:flex;align-items:center;gap:14px;width:100%;min-height:58px;padding:0 20px;border-radius:16px;
  border:1px solid var(--encre);background:transparent;color:var(--encre);font:inherit;font-size:.95rem;font-weight:500;
  text-decoration:none;cursor:pointer;transition:background .2s,transform .12s}
.btn svg{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.btn .txt{display:block;line-height:1.25}
.btn .sous{display:block;font-size:.78rem;font-weight:400;color:var(--encre-douce);margin-top:2px;overflow-wrap:anywhere}
.btn:hover{background:rgba(0,0,0,.06)}
.btn:active{transform:scale(.985)}
.btn:focus-visible{outline:2px solid var(--encre);outline-offset:3px}
.principal{min-height:64px;font-weight:700;color:var(--fond);background:var(--encre)}
.principal:hover{background:#2b2b2b}
.principal svg{stroke-width:1.9}
.merci{margin:14px 0 26px;min-height:1.2em;font-size:.85rem;text-align:center}
.signature{margin-top:auto;width:100%;text-align:center;font-size:.72rem;color:var(--encre-douce);letter-spacing:.04em}
.signature::before{content:"";display:block;width:56px;height:1px;background:var(--encre);margin:0 auto 16px}
.signature b{font-weight:700;color:var(--encre)}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}
@media (min-width:480px){.carte{margin:32px 14px;align-self:flex-start}}
</style>
</head>
